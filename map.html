<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* Map Embed Styles */
.map-embed {
    position: relative;
    width: 100%;
    height: 400px;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid rgba(0, 212, 255, 0.3);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.map-embed iframe {
    width: 100%;
    height: 100%;
    border: none;
    filter: grayscale(20%) contrast(1.1) brightness(0.9);
}

.map-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(5, 5, 16, 0.9), transparent);
    padding: 20px;
    pointer-events: none;
}

.map-info {
    background: rgba(26, 26, 46, 0.9);
    padding: 15px 20px;
    border-radius: 10px;
    border: 1px solid rgba(0, 212, 255, 0.3);
    backdrop-filter: blur(10px);
    pointer-events: auto;
}

.map-info h4 {
    color: var(--primary-color);
    margin-bottom: 8px;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    gap: 10px;
}

.map-info p {
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.directions-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent-gradient);
    color: white;
    padding: 8px 20px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
}

.directions-btn:hover {
    transform: translateY(-3px);
    box-shadow: var(--glow-blue);
}

/* Map Loading Animation */
.map-loading {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--dark-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: opacity 0.5s ease;
}

.map-loading i {
    font-size: 3rem;
    color: var(--primary-color);
    margin-bottom: 20px;
    animation: pulse 1.5s infinite;
}

.map-loading p {
    color: var(--text-secondary);
}
</style>
<body>
    <!-- Contact Section (without registration form) -->
<div class="map-container">
    <div class="map-embed">
        <!-- Google Maps Embed -->
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3931.0531837668456!2d78.10388007455122!3d9.677382287137463!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3b00d42eefa1c4b5%3A0xa813354ac71e6b73!2sSethu%20Institute%20of%20Technology!5e0!3m2!1sen!2sin!4v1700000000000!5m2!1sen!2sin" 
            width="100%" 
            height="400" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
        
        <!-- Map Overlay with Information -->
        <div class="map-overlay">
            <div class="map-info">
                <h4><i class="fas fa-map-marker-alt"></i> Sethu Institute of Technology</h4>
                <p><i class="fas fa-location-dot"></i> Kariapatti, Virudhunagar District, Tamil Nadu - 626115</p>
                <a href="https://www.google.com/maps/dir//Sethu+Institute+of+Technology,+Kariapatti,+Tamil+Nadu+626115" 
                   target="_blank" 
                   class="directions-btn">
                    <i class="fas fa-directions"></i> Get Directions
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
